<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <header>
            <img  class="logo" src="img/logo.png" width="50">
            <div class="aboutUs"> Про нас </div>
        <div class="headerMenu"> Меню </div>
        <div class="contacts"> Контакти </div>
        <div class="promotions"> Акції </div>
        <button class="cartHtml btn btn-success">Кошик<i class="ti ti-garden-cart"></i></button>
    </header>

    <main class ="container">

    <h1 class="title">Ваші товари:</h1>

    <container class="items" id="cartItems">

    </container>
    
    <h4>Оформлення замовлення</h4>
    <form class="row g-3">
  <div class="col-md-6">
    <label for="inputEmail4" class="form-label">ПІБ</label>
    <input type="text" class="form-control" id="inputEmail4">
  </div>
  <div class="col-md-6">
    <label for="inputPassword4" class="form-label">Номер телефону</label>
    <input type="text" class="form-control" id="inputPassword4">
  </div>
    <div class="col-md-6">
    <label for="inputCity" class="form-label">Місто</label>
    <input type="text" class="form-control" id="inputCity">
  </div>
  <div class="col-12">
    <label for="inputAddress" class="form-label">Адреса</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="Вулиця">
  </div>
  <div class="col-12">
    <label for="inputAddress2" class="form-label">Квартира/Номер будинку</label>
    <input type="text" class="form-control" id="inputAddress2" placeholder="Квартира, студія або поверх">
  </div>
  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="gridCheck">
      <label class="form-check-label" for="gridCheck">
        Не передзвонювати
      </label>
    </div>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-success">Підтвердити замовлення</button>
  </div>
</form>

    </main>

    <footer>
        <img class="logo" src="img/logo.png" width="50">
        <p class="phone-number">+380 123 456 789</p>
        <p class="opening-hours">Пн-нд 10:00-22:00</p>
        <div class="social-media">
            <a href="#" class="social-button"><i class="ti ti-brand-instagram"></i></a>
            <a href="#" class="social-button"><i class="ti ti-brand-youtube"></i></a>
            <a href="#" class="social-button"><i class="ti ti-brand-facebook"></i></a>
        </div>
    </footer>


    <script src="js/script.js"></script>
</body>
</html>
